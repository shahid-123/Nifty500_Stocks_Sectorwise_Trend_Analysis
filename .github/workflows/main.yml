
name: Daily Nifty 500 data refresh

on:
  workflow_dispatch:
  schedule:
    # 4:00 PM India time, Monday to Friday
    - cron: "30 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: nifty500-daily-refresh
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh prices and build dashboard
        run: python fetch_data.py --no-open

      - name: Commit refreshed dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Output Input/nifty500_stocks.csv
          if git diff --cached --quiet; then
            echo "No output changes to commit"
          else
            git commit -m "Daily market data refresh"
            git push
          fi
